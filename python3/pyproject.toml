[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inxevolution-realtech"
version = "0.1.0"
description = "Python foundation for In X Evolution Real Technology"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "The Unlicense" }
authors = [{ name = "In X Evolution" }]
dependencies = []

[project.scripts]
inxevolution-realtech = "inxevolution_realtech.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
